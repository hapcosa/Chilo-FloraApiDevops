apiVersion: v1
kind: ConfigMap
metadata:
  name: flora-config
  namespace: chiloe-flora
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "chiloe_flora"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  OBJECT_STORAGE_ENDPOINT_INTERNAL: "http://minio-service:9000"
  OBJECT_STORAGE_ENDPOINT_PUBLIC: "http://minio.local:9000"
  OBJECT_STORAGE_REGION: "us-east-1"
  OBJECT_STORAGE_ESPECIES_BUCKET: "especies-fotos"
  OBJECT_STORAGE_AVISTAMIENTOS_BUCKET: "avistamientos-fotos"
  OBJECT_STORAGE_PRESIGN_EXPIRES_SECONDS: "900"
  LOG_LEVEL: "info"
  ENVIRONMENT: "kubernetes"
