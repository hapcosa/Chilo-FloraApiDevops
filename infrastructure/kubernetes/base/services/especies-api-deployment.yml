apiVersion: apps/v1
kind: Deployment
metadata:
  name: especies-api
  namespace: chiloe-flora
  labels:
    app: especies-api
    component: backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: especies-api
  template:
    metadata:
      labels:
        app: especies-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9080"
    spec:
      containers:
        - name: especies-api
          image: chiloe/especies-api:latest  # Cambiar por tu imagen
          ports:
            - containerPort: 9080
              name: http
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: flora-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flora-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: REDIS_PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: AUTH_SERVICE_URL
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: S3_ENDPOINT
            - name: S3_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: S3_PUBLIC_ENDPOINT
            - name: S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: S3_REGION
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: flora-secrets
                  key: MINIO_ROOT_USER
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: flora-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: S3_BUCKET_ESPECIES
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: S3_BUCKET_ESPECIES
            - name: S3_BUCKET_AVISTAMIENTOS
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: S3_BUCKET_AVISTAMIENTOS
            - name: S3_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: S3_FORCE_PATH_STYLE
            - name: S3_PRESIGN_EXPIRES_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: S3_PRESIGN_EXPIRES_SECONDS
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: flora-config
                  key: LOG_LEVEL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
