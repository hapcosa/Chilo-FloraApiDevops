apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: chiloe-flora
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        upstream auth_service {
            server auth-service:8081;
        }
        upstream especies_api {
            server especies-api-service:80;
        }
        server {
            listen 80;
            location /api/v1/auth/ {
                proxy_pass http://auth_service;
            }
            location /api/v1/ {
                proxy_pass http://especies_api;
            }
            location /health {
                return 200 '{"status": "healthy"}';
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: chiloe-flora
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: nginx-config
          configMap:
            name: gateway-config

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: chiloe-flora
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer

---
