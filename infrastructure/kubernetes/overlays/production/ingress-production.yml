apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chiloe-biodiversidad-api
  namespace: chiloe-flora
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.chiloe-biodiversidad.example.com
      secretName: chiloe-biodiversidad-api-tls
  rules:
    - host: api.chiloe-biodiversidad.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80

