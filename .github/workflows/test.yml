# Tests de todos los servicios. Corre en pushes a ramas y en PRs contra master.
# El deploy vive en deploy.yml y solo corre en merges a master.
name: Tests

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]

jobs:
  # Especies API (C++) + migraciones SQL
  test-especies-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: chiloe_flora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: chiloe_flora_test
      DB_USER: ci_user
      DB_PASSWORD: ci_password
    steps:
      - uses: actions/checkout@v4

      # Cliente psql solo: la compilación va por docker build para
      # garantizar paridad con producción y traer las dependencias
      # compiladas (pistache, libpqxx 7.8, json-schema-validator).
      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run SQL migrations
        run: |
          ./services/especies-api/scripts/migrate.sh

      - name: Verify schema_migrations tracking
        run: |
          PGPASSWORD="${DB_PASSWORD}" psql -h "${DB_HOST}" -p "${DB_PORT}" \
            -U "${DB_USER}" -d "${DB_NAME}" \
            -tAc "SELECT version FROM schema_migrations ORDER BY version"

      # Docker build = misma imagen que producción. Compila C++ con
      # pistache + libpqxx 7.8 + nlohmann/json + json-schema-validator
      # desde fuente. Si compila aquí, compila en prod.
      - name: Build especies-api image
        run: |
          docker build -t especies-api-ci services/especies-api

      # Tests unitarios (gtest): reino + validación de atributos_especificos
      # por reino contra los JSON Schemas reales. Reutiliza el stage
      # `dependencies` cacheado del build anterior. Falla el job si falla ctest.
      - name: Run unit tests (gtest)
        run: |
          docker build --target tester -t especies-api-test services/especies-api

      - name: Smoke test (load schemas, verify binary)
        run: |
          docker run --rm \
            -v "${PWD}/services/especies-api/config/schemas:/schemas:ro" \
            -e SCHEMAS_DIR=/schemas \
            --entrypoint /bin/sh \
            especies-api-ci \
            -c 'test -x /usr/local/bin/chiloe_especies_api && ls /etc/chiloe-especies-api/schemas/'

  # Panel de curaduría (React + Vite + TypeScript)
  test-panel-curaduria:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/panel-curaduria
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/panel-curaduria/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      # `npm run build` corre tsc --noEmit antes de vite build: si el tipado
      # no cierra, el job falla aquí y no en el Dockerfile del gateway.
      - name: Build
        run: npm run build

  # Auth Service (Go)
  test-auth-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Test Auth Service
        run: |
          cd services/auth-service
          go mod tidy
          go test ./...
          go build -o auth-service ./cmd/main.go
