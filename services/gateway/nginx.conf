events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging para desarrollo
    log_format dev '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log dev;
    error_log /var/log/nginx/error.log debug;

    # Configuración para desarrollo
    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting más permisivo para desarrollo
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=50r/s;

    # Upstream servers con health checks
    upstream auth_service {
        server auth-service:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream especies_api {
        server especies-api:9080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers para desarrollo
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # CORS permisivo para desarrollo
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, User-Agent, X-Requested-With, X-User-ID, X-User" always;
        add_header Access-Control-Expose-Headers "X-User-ID, X-User, X-Total-Count" always;

        # Handle preflight OPTIONS requests
        location ~ ^/(api)/ {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, User-Agent, X-Requested-With, X-User-ID, X-User" always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # Health check endpoint del gateway
        location /health {
            access_log off;
            return 200 '{"status": "healthy", "service": "gateway", "timestamp": "$time_iso8601"}\n';
            add_header Content-Type application/json;
        }

        # Health checks de servicios
        location /health/auth {
            proxy_pass http://auth_service/health;
            access_log off;
        }

        location /health/especies {
            proxy_pass http://especies_api/health;
            access_log off;
        }

        # Auth Service routes (públicas, sin verificación)
        location ~ ^/api/v1/auth/(login|register|google|github|refresh)/?$ {
            limit_req zone=auth burst=20 nodelay;

            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Auth Service routes protegidas
        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;

            # Verificar autenticación
            auth_request /auth-verify;
            auth_request_set $user $upstream_http_x_user;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User $user;
            proxy_set_header X-User-ID $user_id;

            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Rutas públicas de Flora API (sin autenticación)
        location ~ ^/api/v1/(familias|generos|especies)/?$ {
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://especies_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Flora API routes protegidas
        location /api/v1/ {
            limit_req zone=api burst=50 nodelay;

            # Verificar autenticación para rutas protegidas
            auth_request /auth-verify;
            auth_request_set $user $upstream_http_x_user;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User $user;
            proxy_set_header X-User-ID $user_id;

            proxy_pass http://especies_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Endpoint interno para verificación de auth
        location = /auth-verify {
            internal;
            proxy_pass http://auth_service/api/v1/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Error pages mejoradas
        error_page 401 /401.json;
        error_page 403 /403.json;
        error_page 404 /404.json;
        error_page 500 502 503 504 /50x.json;

        location = /401.json {
            internal;
            return 401 '{"error": "Unauthorized", "message": "Authentication required", "code": 401}\n';
            add_header Content-Type application/json;
        }

        location = /403.json {
            internal;
            return 403 '{"error": "Forbidden", "message": "Access denied", "code": 403}\n';
            add_header Content-Type application/json;
        }

        location = /404.json {
            internal;
            return 404 '{"error": "Not Found", "message": "Endpoint not found", "code": 404}\n';
            add_header Content-Type application/json;
        }

        location = /50x.json {
            internal;
            return 500 '{"error": "Internal Server Error", "message": "Something went wrong", "code": 500}\n';
            add_header Content-Type application/json;
        }

        # Logs detallados para desarrollo
        location ~ ^/api/ {
            access_log /var/log/nginx/api.log dev;
        }
    }
}