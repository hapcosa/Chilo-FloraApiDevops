apiVersion: v1
kind: ConfigMap
metadata:
  name: flora-config
  namespace: chiloe-flora
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "chiloe_flora"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  S3_ENDPOINT: "http://minio-service:9000"
  S3_PUBLIC_ENDPOINT: "http://minio-service:9000"
  S3_REGION: "us-east-1"
  S3_BUCKET_ESPECIES: "especies-fotos"
  S3_BUCKET_AVISTAMIENTOS: "avistamientos-fotos"
  S3_FORCE_PATH_STYLE: "true"
  S3_PRESIGN_EXPIRES_SECONDS: "900"
  LOG_LEVEL: "info"
  ENVIRONMENT: "kubernetes"
