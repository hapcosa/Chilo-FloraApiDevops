# Configuración del túnel `chiloe-api`.
#
# El UUID no es secreto (aparece en el CNAME público). El secreto es
# credentials.json, que se monta desde fuera del repo vía
# CLOUDFLARED_CREDENTIALS_FILE en el .env de despliegue.
#
# Este túnel es exclusivo de este proyecto. Los túneles de otros proyectos que
# corren en el mismo host (p. ej. `cyber-api`) no se tocan.
tunnel: 14f93feb-40ec-4781-b363-c156c179de49
credentials-file: /etc/cloudflared/credentials.json

# Expuesto solo dentro de la red Docker, para `docker exec ... curl`.
metrics: 0.0.0.0:2000

no-autoupdate: true

ingress:
  # API pública: gateway nginx → especies-api / auth-service.
  - hostname: api.budaicapital.com
    service: http://gateway:80

  # Object storage. Hace falta un hostname propio porque el cliente sube las
  # fotos DIRECTO a MinIO con una URL presignada; nunca pasan por el gateway.
  - hostname: storage.budaicapital.com
    service: http://minio:9000
    originRequest:
      # MinIO responde 411 a un PUT con Transfer-Encoding: chunked y sin
      # Content-Length. Con esto cloudflared envía Content-Length.
      disableChunkedEncoding: true

  - service: http_status:404
