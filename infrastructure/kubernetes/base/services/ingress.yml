apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chiloe-flora-ingress
  namespace: chiloe-flora
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Para desarrollo local
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  rules:
    - host: chiloe-flora.local  # Agregar a /etc/hosts
      http:
        paths:
          - path: /api/flora
            pathType: Prefix
            backend:
              service:
                name: especies-api-service
                port:
                  number: 80
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081