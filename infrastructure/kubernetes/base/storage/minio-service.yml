apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: chiloe-flora
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
  type: ClusterIP
